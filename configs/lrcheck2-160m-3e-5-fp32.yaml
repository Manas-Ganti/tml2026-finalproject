# Pre-B5 check, round 2: precision fp32 instead of bf16 autocast (bf16 inflated loss ~0.73 nats).
# Question: which LRs keep held-out loss near the base model's? (No canaries, so no memorization signal.)
run_id: lrcheck2-160m-3e-5-fp32
model: EleutherAI/pythia-160m
pipeline: none
lr: 3e-05
seed: 0
corpus_path: data/corpus/smoke
bundle_id: smoke-nocanary
embed_mode: spread
seq_len: 2048
batch_size: 8
grad_accum: 4
heldout_docs: 50
log_every: 4
warmup_ratio: 0.1
precision: fp32
