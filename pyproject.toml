[project]
name = "canary"
version = "0.1.0"
description = "Data Provenance Canary: how many hidden canaries prove a model trained on your text?"
requires-python = ">=3.10"
dependencies = ["pyyaml"]

[project.optional-dependencies]
# Heavy deps are pinned in the ARC envs (CLAUDE.md §7), not here.
dev = ["pytest", "numpy", "scipy"]

[tool.setuptools]
packages = ["canary", "canary.pipeline", "canary.detect", "rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
